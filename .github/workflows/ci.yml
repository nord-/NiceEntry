name: CI

on:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The test project links only the pure geometry source and references
      # Microsoft.Maui.Graphics, so it builds and runs without the MAUI workload.
      - name: Test
        run: dotnet test NiceEntry.Tests/NiceEntry.Tests.csproj --configuration Release
